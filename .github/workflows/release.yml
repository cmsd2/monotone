name: Release

# Push a tag vX.Y.Z to publish. A pre-release tag such as vX.Y.Z-rc.1 is a
# rehearsal: it checks the version, runs CI, builds binaries, and runs a publish
# dry run, but publishes nothing and creates no GitHub release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare tag with manifests
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          if [ "$tag" = "$base" ]; then prerelease=false; else prerelease=true; fi
          fail=0
          for pkg in monotone monotone-cli; do
            v=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')
            echo "$pkg manifest version: $v"
            if [ "$v" != "$base" ]; then
              echo "::error::$pkg declares $v but tag $GITHUB_REF_NAME requires $base"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Binary (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p monotone-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="monotone-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/monotone" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: monotone-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: [version, ci, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry run
        if: needs.version.outputs.prerelease == 'true'
        run: cargo publish --workspace --locked --dry-run
      - name: Publish monotone, then monotone-cli
        if: needs.version.outputs.prerelease == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  github-release:
    name: GitHub release
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.version.outputs.version }}
          files: dist/*.tar.gz
          generate_release_notes: true
