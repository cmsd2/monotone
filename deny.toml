# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained. It reaches us only through the
    # aws-smithy-http-client dev-dependency (test-util -> aws-smithy-protocol-test
    # -> cbor-diag), used by the wire-level DynamoDB tests. No published build
    # of monotone or monotone-cli links it. Drop this once smithy removes it.
    { id = "RUSTSEC-2026-0543", reason = "dev-only, transitive via aws-smithy-protocol-test" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
