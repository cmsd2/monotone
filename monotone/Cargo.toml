[package]
name = "monotone"
description = "Monotonic counters and fenced queues for coordination in distributed systems, with in-memory and DynamoDB backends."
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-config", "dep:tokio", "dep:tracing"]
# Deprecated alias kept for one release so `features = ["aws"]` keeps working.
aws = ["dynamodb"]

[dependencies]
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[package.metadata.docs.rs]
all-features = true
