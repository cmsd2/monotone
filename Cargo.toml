[workspace]
resolver = "3"
members = ["monotone", "cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Chris Dawes <cmsd2@cantab.net>"]
repository = "https://github.com/cmsd2/monotone"
categories = ["algorithms", "concurrency", "data-structures", "network-programming"]
keywords = ["monotonic", "counter", "distributed", "dynamodb", "fencing"]

[workspace.dependencies]
monotone = { version = "0.5", path = "monotone" }

aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }

assert_cmd = "2"
predicates = "3"
proptest = "1"
